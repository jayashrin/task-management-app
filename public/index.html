<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Task Manager - Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="auth-container">

    <div class="auth-box">

      <h1>Task Manager</h1>

      <p>Login to manage your tasks</p>

      <form id="loginForm">

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <p id="loginMessage"></p>

      <p>
        Don't have an account?
        <a
          href="#"
          onclick="showRegister()"
        >
          Register
        </a>
      </p>

      <form
        id="registerForm"
        style="display: none;"
      >

        <input
          type="text"
          id="registerName"
          placeholder="Name"
          required
        >

        <input
          type="email"
          id="registerEmail"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          required
        >

        <button type="submit">
          Register
        </button>

      </form>

      <p id="registerMessage"></p>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
